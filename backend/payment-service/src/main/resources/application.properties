
spring.application.name=payment-service
server.port=8081

spring.config.import=optional:file:../../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5433/${PAYMENTS_POSTGRES_DB}
spring.datasource.username=${PAYMENTS_POSTGRES_USER}
spring.datasource.password=${PAYMENTS_POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

payment.reconciliation.enabled=true
payment.reconciliation.fixed-delay=30000
payment.reconciliation.initial-delay=10000
payment.mock.final-status=${PAYMENT_MOCK_FINAL_STATUS:SUCCEEDED}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Security
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-512

# Authentication
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_APP_USERNAME}" password="${KAFKA_APP_PASSWORD}";


# SSL Truststore
spring.kafka.properties.ssl.truststore.location=${KAFKA_SSL_TRUSTSTORE_LOCATION:../../kafka/secrets/kafka.truststore.jks}
spring.kafka.properties.ssl.truststore.password=${KAFKA_SSL_STORE_PASSWORD}
spring.kafka.properties.ssl.truststore.type=JKS


# Kafka Consumer

spring.kafka.consumer.group-id=skating-platform-payment-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
