
databaseChangeLog:
  - changeSet:
      id: create-outbox-events-2026-11-06
      author: skating-platform

      changes:
        - createTable:
            tableName: outbox_events
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: aggregate_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: aggregate_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: event_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: published_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: attempts
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: next_attempt_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: last_error
                  type: TEXT

        - createIndex:
            tableName: outbox_events
            indexName: idx_outbox_events_pending
            columns:
              - column:
                  name: published_at
              - column:
                  name: next_attempt_at
              - column:
                  name: created_at
