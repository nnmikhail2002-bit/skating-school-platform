spring.config.import=optional:file:../../.env[.properties]
spring.application.name=skating-platform-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
security.jwt.secret=${JWT_SECRET}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ==============================
# KAFKA CONFIGURATION
# ==============================

# Kafka broker
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Security: SASL_SSL + SCRAM-SHA-512
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-512

spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_APP_USERNAME}" password="${KAFKA_APP_PASSWORD}";

# SSL Truststore
spring.kafka.properties.ssl.truststore.location=${KAFKA_SSL_TRUSTSTORE_LOCATION:../../kafka/secrets/kafka.truststore.jks}
spring.kafka.properties.ssl.truststore.password=${KAFKA_SSL_STORE_PASSWORD}
spring.kafka.properties.ssl.truststore.type=JKS

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Consumer
spring.kafka.consumer.group-id=skating-platform-booking-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

# Booking Outbox Publisher
booking.outbox.enabled=true
booking.outbox.batch-size=50
booking.outbox.fixed-delay=1000