
services:
  postgres:
    image: postgres:16-alpine
    container_name: skating-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  payments-postgres:
    image: postgres:16-alpine
    container_name: skating-payments-postgres

    environment:
      POSTGRES_DB: ${PAYMENTS_POSTGRES_DB}
      POSTGRES_USER: ${PAYMENTS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PAYMENTS_POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - payments_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENTS_POSTGRES_USER} -d ${PAYMENTS_POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10


  kafka:
    image: apache/kafka:4.3.2
    container_name: skating-kafka
    hostname: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"


      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,SASL_SSL_INTERNAL:SASL_SSL,SASL_SSL:SASL_SSL"

      KAFKA_LISTENERS: "CONTROLLER://:29093,SASL_SSL_INTERNAL://:19092,SASL_SSL://:9092"

      KAFKA_ADVERTISED_LISTENERS: "SASL_SSL_INTERNAL://kafka:19092,SASL_SSL://localhost:9092"

      KAFKA_INTER_BROKER_LISTENER_NAME: "SASL_SSL_INTERNAL"

      KAFKA_SSL_TRUSTSTORE_LOCATION: "/etc/kafka/secrets/kafka.truststore.jks"
      KAFKA_SSL_TRUSTSTORE_PASSWORD: "${KAFKA_SSL_STORE_PASSWORD:?missing in .env}"
      KAFKA_SSL_TRUSTSTORE_TYPE: "JKS"

      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"

      # SCRAM-аутентификация
      KAFKA_SASL_ENABLED_MECHANISMS: "SCRAM-SHA-512"
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: "SCRAM-SHA-512"

      # JAAS
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf"

      # SSL / TLS
      KAFKA_SSL_KEYSTORE_FILENAME: "kafka.keystore.jks"
      KAFKA_SSL_KEYSTORE_CREDENTIALS: "kafka_keystore_creds"
      KAFKA_SSL_KEY_CREDENTIALS: "kafka_ssl_key_creds"
      KAFKA_SSL_TRUSTSTORE_FILENAME: "kafka.truststore.jks"
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: "kafka_truststore_creds"
      KAFKA_SSL_CLIENT_AUTH: "none"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"


      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

    volumes:
      - kafka_data:/tmp/kraft-combined-logs
      - ./kafka/secrets:/etc/kafka/secrets:ro

    restart: unless-stopped

volumes:
  postgres_data:
  payments_postgres_data:
  kafka_data: